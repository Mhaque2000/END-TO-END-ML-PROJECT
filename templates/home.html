```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
        }

        .card {
            margin-top: 40px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            border-radius: 15px 15px 0 0 !important;
            padding: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #e8f5e9;
            color: #198754;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="card-header">
            <h1>Student Exam Performance Indicator</h1>
            <p class="mb-0">Predict Mathematics Exam Performance</p>
        </div>

        <div class="card-body p-4">

            <form action="{{ url_for('predict_datapoint') }}" method="post">

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">Gender</label>

                    <select
                        class="form-select"
                        name="gender"
                        required
                    >
                        <option value="" selected disabled>
                            Select Gender
                        </option>

                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>


                <!-- Ethnicity -->
                <div class="mb-3">
                    <label class="form-label">
                        Race or Ethnicity
                    </label>

                    <select
                        class="form-select"
                        name="ethnicity"
                        required
                    >
                        <option value="" selected disabled>
                            Select Ethnicity
                        </option>

                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>


                <!-- Parental Education -->
                <div class="mb-3">
                    <label class="form-label">
                        Parental Level of Education
                    </label>

                    <select
                        class="form-select"
                        name="parental_level_of_education"
                        required
                    >
                        <option value="" selected disabled>
                            Select Parent Education
                        </option>

                        <option value="associate's degree">
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>

                        <option value="high school">
                            High School
                        </option>

                        <option value="master's degree">
                            Master's Degree
                        </option>

                        <option value="some college">
                            Some College
                        </option>

                        <option value="some high school">
                            Some High School
                        </option>
                    </select>
                </div>


                <!-- Lunch -->
                <div class="mb-3">
                    <label class="form-label">
                        Lunch Type
                    </label>

                    <select
                        class="form-select"
                        name="lunch"
                        required
                    >
                        <option value="" selected disabled>
                            Select Lunch Type
                        </option>

                        <option value="standard">
                            Standard
                        </option>

                        <option value="free/reduced">
                            Free/Reduced
                        </option>
                    </select>
                </div>


                <!-- Test Preparation -->
                <div class="mb-3">
                    <label class="form-label">
                        Test Preparation Course
                    </label>

                    <select
                        class="form-select"
                        name="test_preparation_course"
                        required
                    >
                        <option value="" selected disabled>
                            Select Test Preparation
                        </option>

                        <option value="none">
                            None
                        </option>

                        <option value="completed">
                            Completed
                        </option>
                    </select>
                </div>


                <!-- Reading Score -->
                <div class="mb-3">
                    <label class="form-label">
                        Reading Score (0-100)
                    </label>

                    <input
                        class="form-control"
                        type="number"
                        name="reading_score"
                        placeholder="Enter Reading Score"
                        min="0"
                        max="100"
                        required
                    >
                </div>


                <!-- Writing Score -->
                <div class="mb-3">
                    <label class="form-label">
                        Writing Score (0-100)
                    </label>

                    <input
                        class="form-control"
                        type="number"
                        name="writing_score"
                        placeholder="Enter Writing Score"
                        min="0"
                        max="100"
                        required
                    >
                </div>


                <!-- Submit -->
                <div class="mb-3">
                    <button
                        class="btn btn-primary"
                        type="submit"
                    >
                        Predict Mathematics Score
                    </button>
                </div>

            </form>


            <!-- Prediction Result -->
            {% if results is not none %}
            <div class="result">
                Predicted Mathematics Score:
                {{ results }}
            </div>
            {% endif %}

        </div>
    </div>

</div>

</body>
</html>
```
